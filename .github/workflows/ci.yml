---
name: ci

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: ${{ matrix.os }} ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby: [2.7, 3.4, head, mingw, mswin, ucrt]
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake compile
      - run: bundle exec rake test

  unix:
    name: ${{ matrix.os }} ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby: [2.7, 3.4, head]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake compile
      - run: bundle exec rake test

  jruby:
    name: ubuntu-latest ruby jruby
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby
          bundler-cache: true
      - run: bundle exec rake compile:java
      - run: bundle exec rake test

  memcheck:
    name: Memory leak check (valgrind)
    # valgrind 3.26 (ubuntu-26.04) writes malformed leak XML: https://bugs.kde.org/show_bug.cgi?id=514613
    # Move back to ubuntu-latest once it ships valgrind >= 3.27.
    runs-on: ubuntu-24.04
    env:
      BUNDLE_GEMFILE: Gemfile.memcheck
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: sudo apt-get install -y valgrind
      - run: bundle exec rake compile
      - run: bundle exec rake memcheck
